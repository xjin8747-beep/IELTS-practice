name: Windows test installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ielts-combined-20260811

permissions:
  contents: read

concurrency:
  group: windows-test-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.11.4

jobs:
  windows-installer:
    name: Build unsigned Windows installers
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out combined branch
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/writing-vue/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/writing-vue ci --no-fund --no-audit

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify combined reading and AI contract
        run: node developer/tests/js/combinedBuildContract.test.mjs

      - name: Build NSIS and MSI installers
        run: npx --yes @tauri-apps/cli@$env:TAURI_CLI_VERSION build --bundles nsis,msi

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target\release\bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) { throw 'No Windows installer was produced.' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8 target\release\bundle\SHA256SUMS.txt

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: IELTS-Practice-Windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
